# Bing 站长工具 URL 自动推送
# 原理：每周一自动抓取站点 atom.xml（Hexo feed 插件生成，含全站文章），
#       提取全部文章 URL 组装成 SubmitUrlBatch 请求体，推送给必应收录。
# 安全设计：
#   - 固定 actions/checkout@v4，不使用可变 main 标签
#   - 不安装任何第三方 npm 包（原 hexo-seo-autopush 步骤已删除，推送只依赖 curl+jq，均为 runner 预装）
#   - API key 通过环境变量注入，不进命令行参数，GitHub 日志自动打码
#   - curl 带 --fail-with-body，推送失败时任务显式变红，不会"假成功"
# 手动触发：仓库 Actions 页 → 选本工作流 → Run workflow（发新文章后可手动跑一次）

name: Bing URL Auto Push

on:
  schedule:
    - cron: 0 4 * * 1 # 每周一 04:00 UTC = 北京时间周一 12:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bing-push:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest article URLs from atom.xml
        run: |
          curl -fsS https://exwxsz.github.io/atom.xml -o atom.xml
          # 只提取文章 URL（atom.xml 里的站点主页/self 链接不含 /YYYY/ 路径，自动被过滤）
          grep -oE 'https://exwxsz\.github\.io/[0-9]{4}/[0-9]{2}/[0-9]{2}/[^"<[:space:]]+' atom.xml | sort -u > urls.txt
          count=$(wc -l < urls.txt)
          echo "发现 $count 篇文章 URL"
          if [ "$count" -eq 0 ]; then
            echo "::error::atom.xml 中没有提取到任何文章 URL，请检查 feed 配置是否生效"
            exit 1
          fi
          jq -Rn '{siteUrl:"https://exwxsz.github.io", urlList:[inputs]}' urls.txt > bing.json
          cat bing.json

      - name: Push URLs to Bing
        env:
          BING_API_KEY: ${{ secrets.bing_apikey }}
        run: |
          if [ -z "$BING_API_KEY" ]; then
            echo "::error::secrets.bing_apikey 未配置，请到仓库 Settings -> Secrets and variables -> Actions 添加"
            exit 1
          fi
          curl -sS --fail-with-body -w '\nHTTP %{http_code}\n' -X POST \
            "https://ssl.bing.com/webmaster/api.svc/json/SubmitUrlBatch?apikey=${BING_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @bing.json
