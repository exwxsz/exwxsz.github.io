# Bing 站长工具 URL 自动推送
# 原理：每次运行抓取站点上构建时生成的 bing-urls.json（scripts/generate-bing-urls.js 产出，
#       含全站全部文章 URL，与 RSS 订阅的 atom.xml/limit 配置完全无关），推送给必应收录。
# 安全设计：
#   - 固定 actions/checkout@v4，不使用可变 main 标签
#   - 不安装任何第三方 npm 包，只依赖 runner 预装的 curl+jq
#   - API key 通过环境变量注入，不进命令行参数，GitHub 日志自动打码
#   - curl 带 --fail-with-body，推送失败时任务显式变红，不会"假成功"
# 手动触发：仓库 Actions 页 → 选本工作流 → Run workflow（发新文章并部署后可手动跑一次）

name: Bing URL Auto Push

on:
  schedule:
    - cron: 0 4 * * 1 # 每周一 04:00 UTC = 北京时间周一 12:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bing-push:
    runs-on: ubuntu-latest
    steps:
      - name: Pull full article URL list
        run: |
          curl -fsS https://exwxsz.github.io/bing-urls.json -o bing-urls.json
          count=$(jq '.urlList | length' bing-urls.json)
          echo "全站共 $count 篇文章 URL"
          if [ "$count" -eq 0 ]; then
            echo "::error::bing-urls.json 的 urlList 为空，请检查 scripts/generate-bing-urls.js 是否正常"
            exit 1
          fi
          if [ "$(jq -r '.siteUrl' bing-urls.json)" != "https://exwxsz.github.io" ]; then
            echo "::error::siteUrl 不是预期的 https://exwxsz.github.io"
            exit 1
          fi

      - name: Push URLs to Bing
        env:
          BING_API_KEY: ${{ secrets.bing_apikey }}
        run: |
          if [ -z "$BING_API_KEY" ]; then
            echo "::error::secrets.bing_apikey 未配置，请到仓库 Settings -> Secrets and variables -> Actions 添加"
            exit 1
          fi
          curl -sS --fail-with-body -w '\nHTTP %{http_code}\n' -X POST \
            "https://ssl.bing.com/webmaster/api.svc/json/SubmitUrlBatch?apikey=${BING_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @bing-urls.json
